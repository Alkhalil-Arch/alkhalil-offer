<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شركة الخليل - عرض السعر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #525659; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; }
        #control-panel { 
            display: none; background: #2c3e50; color: white; padding: 20px; width: 1000px; 
            margin: 20px 0; border-radius: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @media print { #control-panel { display: none !important; } body { background: none; } .page { margin: 0 !important; box-shadow: none !important; page-break-after: always !important; width: 297mm !important; height: 210mm !important; } }
        .page { position: relative; width: 297mm; height: 210mm; background-color: white; margin-bottom: 10px; overflow: hidden; }
        .slide-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 1; }
        .content-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .project-info { position: absolute; color: #58595b; font-weight: 700; white-space: nowrap; }
        .excel-value { position: absolute; color: #be1e2d; font-weight: bold; text-align: center; width: 28mm; font-size: 16px; }
        #val0{top:49.5mm;right:243mm} #val1{top:62.8mm;right:243mm} #val2{top:83.5mm;right:243mm} #val3{top:97.2mm;right:243mm} #val4{top:112.5mm;right:243mm} #val5{top:125.8mm;right:243mm} #val6{top:139.5mm;right:243mm}
        #display-project-name{top:167.9mm;right:109mm;font-size:25px} #display-client-name{top:111.2mm;right:40.8mm;text-align:center;width:40mm;font-size:18px} #display-date{top:111.7mm;right:185.5mm;text-align:center;width:40mm;font-size:18px}
        .input-group { display: flex; flex-direction: column; }
        .input-group label { margin-bottom: 5px; font-size: 12px; color: #bdc3c7; }
        .input-group input, .input-group textarea { padding: 8px; border-radius: 5px; border: 1px solid #34495e; font-family: 'Cairo'; font-size: 14px; }
        .wa-btn { grid-column: span 4; background: #25d366; color: white; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="input-group"><label>نوع المشروع:</label><input type="text" id="client-project" value="مشروع سكني" oninput="updateAll()"></div>
        <div class="input-group"><label>اسم العميل:</label><input type="text" id="client-name" placeholder="أدخل اسم العميل" oninput="updateAll()"></div>
        <div class="input-group"><label>اسم الموظف:</label><input type="text" id="employee-name" value="الوليد الشهري" oninput="updateAll()"></div>
        <div class="input-group"><label>رقم الجوال:</label><input type="text" id="client-phone" placeholder="9665xxxxxxxx"></div>
        <div class="input-group"><label>مساحة الأرض:</label><input type="number" id="input-land-area" value="1000" oninput="updateAll()"></div>
        <div class="input-group"><label>نسبة الأرضي %:</label><input type="number" id="perc-ground" value="60" oninput="updateAll()"></div>
        <div class="input-group"><label>نسبة الأول %:</label><input type="number" id="perc-first" value="60" oninput="updateAll()"></div>
        <div class="input-group"><label>نسبة العلوي %:</label><input type="number" id="perc-roof" value="50" oninput="updateAll()"></div>
        <div class="input-group"><label>نسبة الخارجي %:</label><input type="number" id="perc-ext" value="10" oninput="updateAll()"></div>
        <div class="input-group"><label>مساحة القبو:</label><input type="number" id="input-basement" value="0" oninput="updateAll()"></div>
        <div class="input-group" style="grid-column: span 2;"><label>معاينة الرسالة:</label><textarea id="whatsapp-message" readonly></textarea></div>
        <button class="wa-btn" onclick="sendWhatsApp()">إرسال العرض وتسجيله في المتابعة</button>
    </div>

    <div id="pages-container"></div>

    <script>
        const container = document.getElementById('pages-container');
        let currentTotal = 0;
        for (let i = 1; i <= 15; i++) {
            let content = "";
            if (i === 1) content = `<div id="display-project-name" class="project-info">...</div>`;
            if (i === 2) content = `<div id="display-client-name" class="project-info">...</div><div id="display-date" class="project-info">...</div>`;
            if (i === 4) content = `<div id="val0" class="excel-value"></div><div id="val1" class="excel-value"></div><div id="val2" class="excel-value"></div><div id="val3" class="excel-value"></div><div id="val4" class="excel-value"></div><div id="val5" class="excel-value"></div><div id="val6" class="excel-value"></div>`;
            container.innerHTML += `<div class="page"><img src="Slide${i}.jpg" class="slide-img" onerror="this.src='Slide${i}.JPG'"><div class="content-layer">${content}</div></div>`;
        }

        function updateAll() {
            const land = parseFloat(document.getElementById('input-land-area').value) || 0;
            const pg = (parseFloat(document.getElementById('perc-ground').value) || 0) / 100;
            const pf = (parseFloat(document.getElementById('perc-first').value) || 0) / 100;
            const pr = (parseFloat(document.getElementById('perc-roof').value) || 0) / 100;
            const pe = (parseFloat(document.getElementById('perc-ext').value) || 0) / 100;
            const ba = parseFloat(document.getElementById('input-basement').value) || 0;
            const resG = land * pg; const resF = land * pf; const resR = resF * pr; const resE = land * pe;
            currentTotal = Math.round(resG + resF + resR + resE + ba);
            document.getElementById('display-client-name').innerText = document.getElementById('client-name').value || "عميلنا العزيز";
            document.getElementById('display-project-name').innerText = document.getElementById('client-project').value || "مشروعك";
            document.getElementById('display-date').innerText = new Date().toLocaleDateString('en-GB');
            const greet = (new Date().getHours() < 12) ? "يسعد صباحك" : "يسعد مساك";
            document.getElementById('whatsapp-message').value = `أهلاً بك أ. ${document.getElementById('client-name').value} .. ${greet} 🌸\n\nمعك ${document.getElementById('employee-name').value} من شركة الخليل.. حبيت أرسل لك عرض السعر المبدئي لمشروعكم المميز.\n\n🔗 رابط العرض: `;
            const setV = (id, val) => { if(document.getElementById(id)) document.getElementById(id).innerText = Math.round(val).toLocaleString() + " m2"; };
            setV('val0', land); setV('val2', resG); setV('val3', resF); setV('val4', resR); setV('val5', resE); setV('val6', ba); setV('val1', currentTotal);
            const pImg = document.getElementById('img-slide-5');
            if (pImg) {
                if (currentTotal <= 800) pImg.src = "Price800.jpg";
                else if (currentTotal <= 1500) pImg.src = "Price1500.jpg";
                else if (currentTotal <= 3000) pImg.src = "Price3000.jpg";
                else pImg.src = "Slide5.jpg";
            }
        }

        async function sendWhatsApp() {
            const phone = document.getElementById('client-phone').value;
            const name = document.getElementById('client-name').value;
            const project = document.getElementById('client-project').value;
            const land = document.getElementById('input-land-area').value;
            if(!phone) { alert("أدخل رقم الجوال"); return; }
            
            // الرابط الجديد لـ Apps Script
            const scriptURL = "https://script.google.com/macros/s/AKfycbzWraVJmSB6Vl0nnykdq8YGZJB4ox5HSv0E5_swlUF_4z1CocTQTfIxKGcDpGhDb1ls/exec";
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ name: name, phone: phone, land: land, project: project, total: currentTotal })
            });

            const baseURL = "https://alkhalil-arch.github.io/alkhalil-offer/"; 
            const query = `?n=${encodeURIComponent(name)}&p=${encodeURIComponent(project)}&l=${land}&g=${document.getElementById('perc-ground').value}&f=${document.getElementById('perc-first').value}&r=${document.getElementById('perc-roof').value}&e=${document.getElementById('perc-ext').value}&b=${document.getElementById('input-basement').value}`;
            window.location.href = `whatsapp://send?phone=${phone}&text=${encodeURIComponent(document.getElementById('whatsapp-message').value + baseURL + query)}`;
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('admin')) document.getElementById('control-panel').style.display = 'grid';
            if (params.has('l')) {
                document.getElementById('client-name').value = params.get('n') || "";
                document.getElementById('client-project').value = params.get('p') || "";
                document.getElementById('input-land-area').value = params.get('l');
                document.getElementById('perc-ground').value = params.get('g') || 60;
                document.getElementById('perc-first').value = params.get('f') || 60;
                document.getElementById('perc-roof').value = params.get('r') || 50;
                document.getElementById('perc-ext').value = params.get('e') || 10;
                document.getElementById('input-basement').value = params.get('b') || 0;
                updateAll();
            }
        }
        updateAll();
    </script>
</body>
</html>
